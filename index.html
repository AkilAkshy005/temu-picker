<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>Temu Picker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1><a href="/" id="home">Temu Picker</a></h1>
  <p class="sub">Say a product. We find it on Temu, then check web reviews, YouTube and Reddit before you buy.</p>
  <form id="form" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="e.g. phone stand, LED strip, yoga mat" maxlength="80" aria-label="Product">
    <button id="go" type="submit">Find</button>
  </form>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="banner" hidden></div>
  <div id="loading" hidden>
    <div class="spinner"></div>
    <ul id="steps"></ul>
  </div>
  <div id="error" role="alert" hidden></div>
  <section id="summary" hidden></section>
  <section id="results" class="grid"></section>
  <p id="sources" class="small"></p>
</main>
<footer>v8 · Scores come from AI reading public reviews. Always check the proof links.</footer>
<script src="/app.js"></script>
</body>
</html>
